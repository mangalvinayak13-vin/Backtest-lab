[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backtestlab"
version = "0.1.0"
description = "A small, honest backtesting library and command-line tool for daily prices."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mangalvinayak13-vin" }]
dependencies = ["pandas>=3.1", "numpy>=2.5", "matplotlib>=3.11", "jinja2>=3.1", "yfinance>=1.8"]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "hypothesis>=6.170",
    "ruff>=0.17",
    "mypy>=2.4",
    "pandas-stubs>=3.1",
]

[project.scripts]
backtestlab = "backtestlab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/backtestlab"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C90", "T20", "PT", "PTH", "ERA"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
"src/backtestlab/cli.py" = ["T20"]
"scripts/*" = ["T20"]
